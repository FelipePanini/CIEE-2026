# Atualização diária dos dados (níveis dos rios via ANA, avisos da Defesa Civil, checklist e data).
# Faz commit dos JSONs no branch padrão; a Vercel republica automaticamente.
name: atualizar-dados

on:
  schedule:
    - cron: '17 9 * * *' # 06h17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar dados
        run: npm run atualizar-dados
      - name: Validar (Regra nº 1)
        run: npm run validar-dados
      - name: Commit
        run: |
          git config user.name "atualizar-dados[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "dados: atualização automática ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
