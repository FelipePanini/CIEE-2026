# Coleta bruta de fontes oficiais (IBGE, ANA, SGB, Defesa Civil, INMET, DIEESE, ANTT, OSM).
# Roda quando a lista de alvos muda ou manualmente; grava os resultados em data/brutos/ no mesmo branch.
name: coleta-bruta

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/coleta/**'
      - '.github/workflows/coleta-bruta.yml'

permissions:
  contents: write

concurrency:
  group: coleta-bruta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Coletar
        run: npx --yes tsx@4 scripts/coleta/coletar.mts
        env:
          FORCAR_COLETA: ${{ vars.FORCAR_COLETA }}
      - name: Commit dos brutos
        run: |
          git config user.name "coleta-bruta[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brutos
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "dados: coleta bruta automática ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
